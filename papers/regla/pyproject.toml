[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regla"
version = "0.0.1"
description = "REGLA: Refining Gated Linear Attention"
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = {text = "MIT"}
authors = [
    {name = "REGLA Authors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "tokenizers>=0.19.0",
    "datasets>=2.0.0",
    "accelerate>=0.20.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "einops>=0.6.0",
    "lm-eval>=0.4.0",
    "PyYAML>=6.0",
    "pytest>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.1",
]

[tool.setuptools]
packages = ["regla", "regla.core", "regla.train", "regla.eval", "regla.tests"]

[tool.setuptools.package-dir]
regla = "."
