# SwiftEdit Stage 2 (Real Images) Training Configuration
# This file overrides defaults.yaml where necessary to run Stage 2.

version: 1

system:
  device: cuda
  dtype: float16
  autocast: true
  compile: false
  seed: 42
  deterministic: false

paths:
  assets_dir: assets
  sdxl_base_dir: assets/sdxl-base
  sdxl_vae_dir: assets/sdxl-vae
  openclip_dir: assets/openclip
  one_step_gen_dir: assets/one-step-gen
  checkpoints_dir: checkpoints
  logs_dir: logs
  datasets:
    journeydb_captions: swiftedit/datasets/journeydb_captions.txt
    commoncanvas_root: data/commoncanvas
    piebench_root: data/piebench

models:
  vae:
    type: sdxl
    repo_dir: ${paths.sdxl_vae_dir}
    latent_channels: 4
    scaling_factor: 0.18215
    image_norm: "[-1,1]"
    sample_size: 512
    dtype: float16
  clip:
    text:
      provider: openclip
      model_name: ViT-L-14
      pretrained: laion2b_s32b_b82k
      max_length: 77
      dtype: float32
      freeze: true
    image:
      provider: openclip
      model_name: ViT-L-14
      pretrained: laion2b_s32b_b82k
      dtype: float32
      freeze: true
  generator:
    name: swiftbrushv2
    repo_dir: ${paths.one_step_gen_dir}
    latent_channels: 4
    text_embed_dim: 768
    heads: 12
    hidden_dim: 1536
    dtype: float16
    requires_text_condition: true
  ip_adapter:
    enabled: true
    projector:
      in_dim: 768
      out_dim: 768
      num_tokens: 4
    branch:
      trainable: false  # Stage 2: image branch frozen
      freeze_in_stage2: true
      default_scale_sx: 1.0
  inversion_net:
    name: invnet_f_theta
    init_from_generator: true
    dtype: float16
    ema:
      enabled: true
      decay: 0.999

aram:
  enabled: true
  s_y: 1.0
  s_edit: 0.3
  s_non_edit: 1.5
  mask:
    blur_sigma: 1.0
    soft_threshold: 0.0
    clamp_min: 0.0
    clamp_max: 1.0

schedulers:
  teacher:
    unet_repo_dir: ${paths.sdxl_base_dir}
    scheduler_type: DDPM
    num_train_timesteps: 1000
    min_t: 0
    max_t: 999
    weighting: uniform

training:
  stage2:
    enabled: true
    batch_size: 1
    num_iters: 180000
    lr: 1.0e-5
    weight_decay: 0.0
    grad_clip_norm: 1.0
    ema_decay: 0.999
    log_every: 100
    save_every: 2000
    image_resolution: 512
    losses:
      dists_weight: 1.0
      regu_weight: 0.5
      w_t_schedule: uniform
      t_range: [250, 750]
    freeze:
      generator_ip: true
      vae: true
      clip_text: true
      clip_image: true
      ip_adapter_branch: true
      projector: true
      inversion_net: false
    dataset:
      name: CommonCanvas
      root: ${paths.datasets.commoncanvas_root}
      prompts_file: prompts.json
      shuffle: true

inference:
  image_resolution: 512
  use_self_guided_mask: true
  use_user_mask_if_provided: true
  aram_scales:
    s_y: ${aram.s_y}
    s_edit: ${aram.s_edit}
    s_non_edit: ${aram.s_non_edit}
  mask_extractor:
    blur_sigma: ${aram.mask.blur_sigma}
    soft_threshold: ${aram.mask.soft_threshold}
  precision:
    dtype: ${system.dtype}
    autocast: ${system.autocast}

logging:
  project_name: SwiftEdit
  version_log: true
  save_config_snapshot: true
  results_csv_dir: results
  visualize_every: 1000
